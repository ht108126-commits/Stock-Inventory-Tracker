steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stock-inventory-tracker:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/stock-inventory-tracker:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'stock-inventory-tracker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stock-inventory-tracker:$COMMIT_SHA'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=stock-notebook-8b041,DEFAULT_SPREADSHEET_ID=1YWMTQS-wo_HUcQsWuewAZkn6wP36C-o2P5ftgc9WDCw,ALLOWED_OWNER_EMAILS=ht108126@gmail.com,CRON_SECRET=sit_cron_secret_8b041'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--memory'
      - '512Mi'

images:
  - 'gcr.io/$PROJECT_ID/stock-inventory-tracker:$COMMIT_SHA'
